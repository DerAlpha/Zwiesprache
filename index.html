n Konto und keine Analyse. Nachrichten und Dateien gehen per WebRTC direkt zwischen euren Browsern hin und her.`,`Den Verbindungsaufbau erledigt ihr selbst, indem ihr Einladung und Antwort austauscht. Die Codes stehen im Teil der Adresse nach dem #. Dieser Teil wird nie an den Webserver geschickt, und die App entfernt ihn sofort aus der Adresszeile und dem Verlauf.`,`Einzige Ausnahme: Ein STUN-Server (änderbar, abschaltbar) hilft beim Finden der öffentlichen Adresse. Optional leitet ein TURN-Server die verschlüsselten Daten weiter. Beide sehen IP-Adressen, aber keine Inhalte.`]},{heading:`Zwei Verschlüsselungsschichten`,paragraphs:[`Erste Schicht: WebRTC verschlüsselt den Datenkanal immer mit DTLS. Das erzwingt der Browser.`,`Zweite Schicht: Direkt nach dem Verbindungsaufbau erzeugen beide Geräte neue Schlüssel (ECDH P-256) und leiten daraus für jede Richtung einen eigenen AES-256-GCM-Schlüssel ab. Jede Nachricht, jede Datei, jede Tipp-Anzeige und jede Lesebestätigung läuft zusätzlich durch diese Schicht. Wiederholte oder veränderte Nachrichten werden verworfen. Verwendet wird ausschließlich die Web-Crypto-Schnittstelle des Browsers – keine selbst erfundene Kryptografie.`]},{heading:`Der Sicherheitscode`,paragraphs:[`Wer die Einladung unterwegs abfängt und austauscht, könnte sich unbemerkt dazwischenschalten („Man in the Middle“). Dagegen hilft der 20-stellige Sicherheitscode. Er wird aus den Zertifikats-Fingerprints beider Browser und beiden neuen Schlüsseln berechnet.`,`Der Code ist nur dann auf beiden Geräten gleich, wenn niemand dazwischensitzt. Vergleicht ihn deshalb über einen anderen Weg – am Telefon oder persönlich – und tippt dann auf „Verifiziert“.`]},{heading:`Deine IP-Adresse`,paragraphs:[`Damit sich eure Geräte finden, stehen im Einladungs- und Antwort-Code eure IP-Adressen. Sie sind für dein Gegenüber sichtbar – und für jeden, der den Link oder Code sieht, etwa den Messenger, über den du ihn schickst.`,`Wenn du das nicht möchtest, trage in den Einstellungen einen eigenen TURN-Server ein und aktiviere „IP verbergen“. Dann steht nur die Adresse des TURN-Servers im Code.`]},{heading:`Was gespeichert wird`,paragraphs:[`Nachrichten und Dateien existieren nur im Arbeitsspeicher dieses Tabs. Schließt du ihn oder beendest den Chat, sind sie weg. Nur deine Einstellungen landen im lokalen Speicher des Browsers – das TURN-Passwort nur, wenn du „merken“ aktivierst.`]},{heading:`Grenzen – ehrlich gesagt`,paragraphs:[`Keine App schützt vor Screenshots, Fotos vom Bildschirm oder davor, dass dein Gegenüber Inhalte weitergibt.`,`Ist ein Gerät kompromittiert (Schadsoftware, bösartige Browser-Erweiterungen), kann es alles mitlesen.`,`Du vertraust dem Webspace, von dem du die App lädst: Wer ihn manipuliert, könnte veränderten Code ausliefern. Wer sichergehen will, nutzt die Einzeldatei-Version (zwiesprache.html) und prüft ihre SHA-256-Prüfsumme gegen die veröffentlichte.`,`Dateien werden ungeprüft übertragen. Bilder zeigt die App nur in sicheren Formaten an; alles andere wird nur gespeichert, nie in der App geöffnet. Öffne gespeicherte Dateien nur, wenn du deinem Gegenüber vertraust.`,`Metadaten wie „wann und wie lange wart ihr verbunden“ und eure IP-Adressen sind für Netzbetreiber sowie STUN/TURN-Server sichtbar.`]}]}},P=`ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_`,Ce=(()=>{let e=new Int16Array(128).fill(-1);for(let t=0;t<64;t++)e[P.charCodeAt(t)]=t;return e})();function we(e){let t=``,n=0;for(;n+2<e.length;n+=3){let r=e[n]<<16|e[n+1]<<8|e[n+2];t+=P[r>>18&63]+P[r>>12&63]+P[r>>6&63]+P[r&63]}let r=e.length-n;if(r===1){let r=e[n]<<16;t+=P[r>>18&63]+P[r>>12&63]}else if(r===2){let r=e[n]<<16|e[n+1]<<8;t+=P[r>>18&63]+P[r>>12&63]+P[r>>6&63]}return t}function Te(e){if(e.length%4==1)throw Error(`base64url: ungültige Länge`);let t=Math.floor(e.length*3/4),n=new Uint8Array(t),r=0,i=0,a=0;for(let t=0;t<e.length;t++){let o=e.charCodeAt(t),s=o<128?Ce[o]:-1;if(s<0)throw Error(`base64url: ungültiges Zeichen`);r=r<<6|s,i+=6,i>
